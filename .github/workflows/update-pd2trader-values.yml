name: Update PD2 Trader Values

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pd2trader-values
  cancel-in-progress: false

jobs:
  update-pd2trader-values:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Every Roofoo filter on the launcher list gets the same rune prices; the market is read once per run.
      - name: Update rune and currency values
        run: node scripts/update-pd2trader-runes.mjs
        env:
          FILTER_FILE: Roofoo.filter,RoofooMystery.filter,RoofooBIS.filter,RoofooMysteryBIS.filter,RoofooHealthBar.filter,RoofooMysteryHealthBar.filter,RoofooHealthBarBIS.filter,RoofooMysteryHealthBarBIS.filter,RoofooLoadingBar.filter,RoofooMysteryLoadingBar.filter,RoofooLoadingBarBIS.filter,RoofooMysteryLoadingBarBIS.filter,RoofooSlamfestBETA.filter
          PD2TRADER_LADDER: 'true'
          PD2TRADER_HARDCORE: 'false'

      # The BIS checker only lives in the + BIS files and Slamfest. The script stops if a file here has no BIS block.
      - name: Update BIS slam values
        run: node scripts/update-pd2trader-bis-slams.mjs
        env:
          FILTER_FILE: RoofooBIS.filter,RoofooMysteryBIS.filter,RoofooHealthBarBIS.filter,RoofooMysteryHealthBarBIS.filter,RoofooLoadingBarBIS.filter,RoofooMysteryLoadingBarBIS.filter,RoofooSlamfestBETA.filter
          PD2TRADER_LADDER: 'true'
          PD2TRADER_HARDCORE: 'false'
          PD2TRADER_HOURS: '48'
          PD2TRADER_BIS_MIN_SAMPLES: '2'
          # BIS lines show on Endgame - Standard (FL4) and Endgame - All Flawless Gems (FL7)
          PD2TRADER_BIS_LEVELS: '4,7'
          # "Not worth slamming" turns on after the first week of Season 14 (starts Oct 23)
          PD2TRADER_NOT_WORTH_FROM: '2026-10-30'

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Roofoo.filter RoofooMystery.filter RoofooBIS.filter RoofooMysteryBIS.filter RoofooHealthBar.filter RoofooMysteryHealthBar.filter RoofooHealthBarBIS.filter RoofooMysteryHealthBarBIS.filter RoofooLoadingBar.filter RoofooMysteryLoadingBar.filter RoofooLoadingBarBIS.filter RoofooMysteryLoadingBarBIS.filter RoofooSlamfestBETA.filter; then
            echo "No PD2 Trader value changes to commit."
            exit 0
          fi
          git add Roofoo.filter RoofooMystery.filter RoofooBIS.filter RoofooMysteryBIS.filter RoofooHealthBar.filter RoofooMysteryHealthBar.filter RoofooHealthBarBIS.filter RoofooMysteryHealthBarBIS.filter RoofooLoadingBar.filter RoofooMysteryLoadingBar.filter RoofooLoadingBarBIS.filter RoofooMysteryLoadingBarBIS.filter RoofooSlamfestBETA.filter
          git commit -m "Update PD2 Trader values"
          git pull --rebase origin main
          git push origin HEAD:main
